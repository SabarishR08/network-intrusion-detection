name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax smoke test (compileall, dependency-free)
        run: |
          python -m compileall -q src scripts main.py
          echo "All Python sources compile cleanly."
